services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carematch
      POSTGRES_USER: carematch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carematch}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - carematch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carematch -d carematch']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  carematch_postgres:
